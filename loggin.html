    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>
</head>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

        <li>Apples</li>

        <li>Milk</li>
    </ul>

</body>
